name: Dev Build

# Rolling Development-Build. Laeuft bei jedem Push auf main und ueberschreibt
# das Prerelease unter dem festen Tag "dev". Der Release-Workflow bleibt
# unberuehrt - der triggert nur auf Tags "v*".
on:
  push:
    branches:
      - main
    # ADAPT 1: Nicht-Code-Pfade dieses Repos.
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE.md"
      - "libs_report.md"
      - "Screenshot/**"
      - "Logo/**"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Parallele Pushes duerfen sich nicht gegenseitig ueberschreiben. Der laufende
# Job wird abgebrochen, sobald ein neuerer startet.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: Addon

      - name: StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check Addon

  dev:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version und Commit-Info lesen
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Basis ist die kommende Version aus CHANGELOG.md, solange sie neuer als das
          # letzte echte Release ist, sonst das Release selbst. Die .toc taugt nicht,
          # dort steht nur der Platzhalter git-build.
          # --exclude-pre-releases blendet den rollenden dev-Tag und -test-Laeufe aus.
          RELEASED=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          RELEASED="${RELEASED#v}"
          [ -n "$RELEASED" ] || RELEASED="0.00"

          # ADAPT 7: Ueberschrift der obersten Version im Changelog.
          NEXT=$(sed -n -E 's/^## \[ver\. ([0-9.]+)\].*/\1/p' CHANGELOG.md | head -n1)
          VERSION="$RELEASED"
          if [ -n "$NEXT" ] && [ "$(printf '%s\n%s\n' "$RELEASED" "$NEXT" | sort -V | tail -n1)" = "$NEXT" ]; then
            VERSION="$NEXT"
          fi

          SHORT="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT}" >> "$GITHUB_OUTPUT"

          # Die .toc der ausgelieferten Dateien markieren, damit im Spiel
          # sichtbar ist, dass es kein Release ist.
          # ADAPT 2: Glob der .toc-Dateien, die den dev-Stempel bekommen.
          for TOC in Addon/ElvUI_mMediaTag/ElvUI_mMediaTag_*.toc; do
            [ -e "$TOC" ] || continue
            sed -i "s/^## Version:.*/## Version: ${VERSION}-dev-${SHORT}/" "$TOC"
          done

          # !mMT_MediaPack haengt an eigenen pack-v* Tags und bekommt bewusst
          # keinen dev-Stempel - es aendert sich unabhaengig vom Hauptaddon.
          # Gestempelt wird trotzdem, sonst stuende "git-build" im Addon-Fenster.
          PACK_VERSION=$(git tag -l 'pack-v*' --sort=-v:refname | head -n1)
          PACK_VERSION="${PACK_VERSION#pack-v}"
          [ -n "$PACK_VERSION" ] || PACK_VERSION="0.00"

          for TOC in Addon/!mMT_MediaPack/!mMT_MediaPack_*.toc; do
            [ -e "$TOC" ] || continue
            sed -i "s/^## Version:.*/## Version: ${PACK_VERSION}/" "$TOC"
          done

      - name: Subversion installieren
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3
          sudo -E apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 subversion

      # ADAPT 3: Kompletter Step - 1:1 aus dem release.yml des jeweiligen Repos
      # uebernehmen. Hat das Addon keine externen Libs, Step und den davor
      # ersatzlos loeschen.
      - name: Libs holen
        run: |
          set -e
          PACK="Addon/!mMT_MediaPack/libs"
          rm -rf "$PACK"
          mkdir -p "$PACK"

          svn export --force https://repos.curseforge.com/wow/libstub/trunk "$PACK/LibStub"
          svn export --force https://repos.curseforge.com/wow/callbackhandler/trunk/CallbackHandler-1.0 "$PACK/CallbackHandler-1.0"
          svn export --force https://repos.curseforge.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0 "$PACK/LibSharedMedia-3.0"

          MMT="Addon/ElvUI_mMediaTag/lib"
          rm -rf "$MMT/AceLocale-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceLocale-3.0 "$MMT/AceLocale-3.0"

      # Konstanter Dateiname - sonst aendert sich die Download-URL bei jedem Lauf.
      - name: Zip bauen
        run: |
          # ADAPT 4: Basisordner, Addon-Ordner und Zip-Name. Liegt das Addon im
          # Repo-Root statt unter Addon/, das "cd" streichen.
          cd Addon
          zip -r "../mMT-dev.zip" "ElvUI_mMediaTag" "!mMT_MediaPack" -x "*/.svn/*"

      # ADAPT 5: Repo-Pfad im Release-Link.
      - name: Write release notes
        run: |
          cat > DEV_NOTES.md <<'HEADER'
          > ⚠️ **Untested development build.** Built automatically on every push to `main` and not verified in-game. For a stable version please use the latest [Release](https://github.com/mBlinkii/mMediaTag/releases/latest).

          HEADER
          {
            echo "**Version:** ${{ steps.meta.outputs.version }}-dev-${{ steps.meta.outputs.sha }}"
            echo "**Commit:** ${GITHUB_SHA}"
            echo "**Built:** $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo
            echo '## Latest commit'
            echo
            echo '```'
            git log -1 --pretty=%B
            echo '```'
          } >> DEV_NOTES.md

      # Die Release-Action legt den Tag nur an und verschiebt einen vorhandenen
      # nicht, sonst bliebe "dev" auf dem ersten Build stehen.
      - name: dev-Tag verschieben
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev

      # Tag und Prerelease werden bei jedem Lauf neu gesetzt. Das Asset traegt
      # denselben Namen, damit die Download-URL stabil bleibt.
      - name: Prerelease veroeffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          # ADAPT 6: Release-Titel und Asset-Name (muss zu ADAPT 4 passen).
          name: mMT Development Build ${{ steps.meta.outputs.version }}-dev-${{ steps.meta.outputs.sha }}
          body_path: DEV_NOTES.md
          files: mMT-dev.zip
          prerelease: true
          make_latest: false
