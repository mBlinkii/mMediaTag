name: Release

# Läuft bei jedem Versions-Tag, z.B.: git tag v4.07 && git push origin v4.07
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus Tag lesen, Datum bestimmen
        id: meta
        run: |
          set -e
          # Die Version kommt aus dem Tag, der den Lauf ausgeloest hat, damit
          # Release, Zip, CurseForge und Wago immer die getaggte Nummer
          # tragen - auch wenn die "## Version:" Zeile einer .toc
          # hinterherhinkt. Gleiche Regel wie in Blinkiis-Portraits und
          # MAUI-M-Timer.
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date +%d%m%Y)
          echo "zipname=mMT-v${VERSION}-${DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Die ausgelieferten .toc Dateien auf den Tag ziehen. Nur die von
          # ElvUI_mMediaTag - !mMT_MediaPack liegt zwar im selben Zip, hat
          # aber eine eigene, unabhaengige Versionsnummer und darf nicht
          # ueberschrieben werden.
          for TOC in Addon/ElvUI_mMediaTag/ElvUI_mMediaTag_*.toc; do
            [ -e "$TOC" ] || continue
            sed -i "s/^## Version:.*/## Version: ${VERSION}/" "$TOC"
          done

      # Die Libs liegen nicht im Repo, sondern werden hier frisch von
      # CurseForge geholt. Gleiche Regel wie in MAUI-M-Timer.
      - name: Subversion installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Libs holen
        run: |
          set -e
          PACK="Addon/!mMT_MediaPack/libs"
          rm -rf "$PACK"
          mkdir -p "$PACK"

          svn export --force https://repos.curseforge.com/wow/libstub/trunk "$PACK/LibStub"
          svn export --force https://repos.curseforge.com/wow/callbackhandler/trunk/CallbackHandler-1.0 "$PACK/CallbackHandler-1.0"
          svn export --force https://repos.curseforge.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0 "$PACK/LibSharedMedia-3.0"

          # lib/ enthaelt ausserdem das getrackte load_libs.xml - nur den
          # AceLocale-Ordner ersetzen, nicht das ganze Verzeichnis.
          MMT="Addon/ElvUI_mMediaTag/lib"
          rm -rf "$MMT/AceLocale-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceLocale-3.0 "$MMT/AceLocale-3.0"

      - name: Zip bauen
        run: |
          cd Addon
          zip -r "../${{ steps.meta.outputs.zipname }}.zip" "ElvUI_mMediaTag" "!mMT_MediaPack" -x "*/.svn/*"

      # passenden Versions-Abschnitt aus CHANGELOG.md ziehen
      - name: Changelog-Abschnitt extrahieren
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Die Kategorie-Ueberschriften tragen inzwischen ein Icon
          # ("### 🐛 FIX"), koennen es aber auch weglassen. Deshalb matchen
          # die sed-Regeln auf das Schluesselwort und erlauben davor ein
          # beliebiges Zeichen plus Leerzeichen - genauso wie der Parser im
          # wow-addon-changelog-Skill.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[ver\\. " ver "\\]" {flag=1; next}
            /^## \[ver\./ {flag=0}
            flag' CHANGELOG.md | sed -E -e 's/\r$//' \
              -e 's/^###[[:space:]]+([^[:space:]]+[[:space:]]+)?FIX[[:space:]]*$/## 🐛 Fixes/' \
              -e 's/^###[[:space:]]+([^[:space:]]+[[:space:]]+)?UPDATE[[:space:]]*$/## 🔧 Updates/' \
              -e 's/^###[[:space:]]+([^[:space:]]+[[:space:]]+)?NEW[[:space:]]*$/## ✨ New/' \
              -e 's/^###[[:space:]]+([^[:space:]]+[[:space:]]+)?INFO[[:space:]]*$/## 📌 Info/' \
              -e 's/^- (FIX|UPDATE|NEW|INFO) - /- /' \
              -e 's/^- \[([^]]*)\]:/- **[\1]**/' \
              -e 's/^## /\n## /' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "WARNUNG: Kein Abschnitt fuer ${VERSION} in CHANGELOG.md gefunden."
            echo "Siehe CHANGELOG.md im Repository." > RELEASE_NOTES.md
          fi
          {
            echo "notes<<NOTES_EOF"
            cat RELEASE_NOTES.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: mMT v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zipname }}.zip
          body_path: RELEASE_NOTES.md

      # Spielversion(en) aus "## Interface: 110200, ..." ableiten (110200 -> 11.2.0)
      - name: Interface-Version aus TOC lesen
        id: game
        run: |
          IFACES=$(grep -oP '^## Interface:\s*\K.+' "Addon/ElvUI_mMediaTag/ElvUI_mMediaTag_Mainline.toc" | tr -d '\r ' )
          VERSIONS=""
          IFS=',' read -ra ARR <<< "$IFACES"
          for I in "${ARR[@]}"; do
            V="$((10#$I / 10000)).$(((10#$I % 10000) / 100)).$((10#$I % 100))"
            VERSIONS="${VERSIONS:+$VERSIONS,}$V"
          done
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Auf CurseForge hochladen
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ secrets.CF_PROJECT_ID }}
          game_endpoint: wow
          file_path: ${{ steps.meta.outputs.zipname }}.zip
          display_name: mMT v${{ steps.meta.outputs.version }}
          game_versions: ${{ steps.game.outputs.versions }}
          release_type: release
          changelog: ${{ steps.changelog.outputs.notes }}
          changelog_type: markdown

      # Laeuft zuletzt, damit die Meldung erst rausgeht, wenn GitHub-Release und
      # CurseForge-Upload durch sind. Der rollende dev-Tag aus dev.yml matcht den
      # v*-Trigger nicht - die zusaetzliche if-Bedingung ist nur ein Sicherheitsnetz.
      - name: Discord benachrichtigen
        if: github.ref_type == 'tag' && github.ref_name != 'dev'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK ist nicht gesetzt - Benachrichtigung uebersprungen."
            exit 0
          fi

          head -c 3800 RELEASE_NOTES.md > DISCORD_BODY.md

          # Changelog-Text nur ueber --rawfile/--arg einspeisen, nie in den
          # Shell-String interpolieren - sonst brechen Anfuehrungszeichen und
          # Backticks aus dem Changelog das JSON.
          jq -n \
            --arg title "mMediaTag v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --rawfile desc DISCORD_BODY.md \
            --arg icon "https://raw.githubusercontent.com/mBlinkii/mMediaTag/main/Logo/icon%20v4.png" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 10181046, thumbnail: {url: $icon}}]}' \
            > DISCORD_PAYLOAD.json

          HTTP=$(curl -sS -o DISCORD_RESPONSE.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            --data-binary @DISCORD_PAYLOAD.json "$WEBHOOK") || {
            echo "::warning::curl konnte den Discord-Webhook nicht erreichen."
            exit 0
          }

          if [ "$HTTP" -ge 300 ]; then
            echo "::warning::Discord antwortete mit HTTP ${HTTP}."
            cat DISCORD_RESPONSE.txt
          else
            echo "Discord benachrichtigt (HTTP ${HTTP})."
          fi
